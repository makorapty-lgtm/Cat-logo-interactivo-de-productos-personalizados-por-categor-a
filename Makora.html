<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Makora — Catálogo Interactivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0E1326; font-family: 'Geist', system-ui, sans-serif; }
    .frame-host {
      width: 100%; height: 100%; border: none; background: white;
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel">
    function CatalogIframe() {
      return (
        <iframe src="Makora Catalogo.html" className="frame-host" style={{ width: "100%", height: "100%", border: "none", background: "white" }}/>
      );
    }
    function MobileIframe() {
      return (
        <iframe src="mobile-app.html" className="frame-host" style={{ width: "100%", height: "100%", border: "none", background: "white" }}/>
      );
    }

    function App() {
      return (
        <DesignCanvas
          title="Makora · Catálogo Interactivo"
          subtitle="Catálogo desktop completo + landing móvil dedicada · Productos personalizados · Panamá"
        >
          <DCSection id="experiencia" title="Experiencia principal" subtitle="Click en cualquier artboard para abrirlo a pantalla completa. Pulsa Tweaks en el toolbar para personalizar.">
            <DCArtboard id="catalogo-desktop" label="Catálogo · Desktop · 1440px" width={1440} height={2400}>
              <CatalogIframe/>
            </DCArtboard>
            <DCArtboard id="catalogo-mobile" label="Catálogo · iPhone · Landing móvil dedicada" width={400} height={840}>
              <IOSDevice width={390} height={844}>
                <MobileIframe/>
              </IOSDevice>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
